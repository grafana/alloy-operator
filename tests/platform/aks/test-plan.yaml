---
apiVersion: helm-chart-toolbox.grafana.com/v1
kind: TestPlan
name: aks

subject:
  releaseName: alloy-operator
  path: ../../../charts/alloy-operator
  namespace: operator

  postInstall:
    files: [alloy.yaml]

cluster:
  type: aks
  args:
    - --node-count=1
    - --tier=free
    - --enable-managed-identity
    - --generate-ssh-keys
  appendRandomNumber: true

dependencies:
  - preset: test-parameters
  - preset: test-parameters
    namespace: toolbox
  - file: grafana-cloud-credentials.yaml

tests:
  - type: query-test
    values:
      tests:
        - env:
            PROMETHEUS_URL: https://prometheus-prod-13-prod-us-east-0.grafana.net/api/prom/api/v1/query
          envFrom:
            - secretRef: {name: grafana-cloud-credentials}
            - configMapRef: {name: test-parameters}
          queries:
            # The operator deployed an Alloy instance that remote-writes its own metrics
            # to Grafana Cloud, labeled with this test's randomized cluster name.
            - query: alloy_build_info{cluster="$clusterName"}
              type: promql
