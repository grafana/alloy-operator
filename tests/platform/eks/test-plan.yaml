---
apiVersion: helm-chart-toolbox.grafana.com/v1
kind: TestPlan
name: eks

subject:
  releaseName: alloy-operator
  path: ../../../charts/alloy-operator
  namespace: operator

  postInstall:
    files:
      - alloy-linux.yaml
      - alloy-windows.yaml

cluster:
  type: eks
  configFile: eks-cluster-config.yaml
  appendRandomNumber: true

dependencies:
  - preset: test-parameters
  - preset: test-parameters
    namespace: toolbox
  - file: grafana-cloud-credentials.yaml

tests:
  - type: query-test
    values:
      tests:
        - env:
            PROMETHEUS_URL: https://prometheus-prod-13-prod-us-east-0.grafana.net/api/prom/api/v1/query
          envFrom:
            - secretRef: {name: grafana-cloud-credentials}
            - configMapRef: {name: test-parameters}
          queries:
            # The operator (running on the Linux node) deployed an Alloy instance that
            # remote-writes its own metrics to Grafana Cloud. The cluster also contains a
            # Windows node (see eks-cluster-config.yaml) to exercise mixed-OS scheduling.
            - query: alloy_build_info{cluster="$clusterName"}
              type: promql
